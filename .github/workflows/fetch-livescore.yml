name: Fetch live football scores

on:
  schedule:
    # 5분마다 실행 (K리그 + EPL/분데스리가/라리가/세리에A/리그앙 진행 경기 갱신용)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live football scores
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/fetch-livescore-football.js

      - name: Commit & push if changed
        run: |
          if git status --porcelain data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: live football score update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No data changes; skip commit."
          fi
